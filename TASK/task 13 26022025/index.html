<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 100px;
            height: 100px;
            background: lightblue;
            text-align: center;
            line-height: 100px;
            margin: 50px;
            transition: transform 0.3s ease-in-out;
        }
        .box:hover{
            transform: translate(50px, 20px);
        }
    </style>
</head>
<body>
    <div class="box">Move me</div>

</body>
</html>
