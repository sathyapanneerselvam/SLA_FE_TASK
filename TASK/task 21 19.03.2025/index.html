    <script>
        // Base class: Account
class Account {
    constructor(accountNumber, holderName, balance) {
        this.accountNumber = accountNumber;
        this.holderName = holderName;
        this.balance = balance;
    }

    deposit(amount) {
        if (amount > 0) {
            this.balance += amount;
            console.log(`Deposited ₹${amount}. New balance: ₹${this.balance}`);
        } else {
            console.log("Deposit amount must be positive.");
        }
    }

    withdraw(amount) {
        if (amount > 0 && amount <= this.balance) {
            this.balance -= amount;
            console.log(`Withdrawn ₹${amount}. Remaining balance: ₹${this.balance}`);
        } else {
            console.log("Invalid withdrawal amount or insufficient balance.");
        }
    }

    displayBalance() {
        console.log(`Account Balance: ₹${this.balance}`);
    }
}

// Derived class: SavingAccount
class SavingAccount extends Account {
    constructor(accountNumber, holderName, balance, interestRate) {
        super(accountNumber, holderName, balance);
        this.interestRate = interestRate;
    }

    addInterest() {
        let interest = (this.balance * this.interestRate) / 100;
        this.balance += interest;
        console.log(`Interest added: ₹${interest}. New balance: ₹${this.balance}`);
    }
}
