<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="gee"></p>
    <script>
        const num = [6,8,9,2,4,10];
        let n = " ";
        for(let i = num.length-1; i >=0; i-- ){
            n += num[i] + " " ;
        }
        console.log(n)
        document.getElementById("gee").innerHTML = n;
    </script> 
</body>
</html>
