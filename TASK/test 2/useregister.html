<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login & Register</title>
  <style>
    body {
      background-color: rgba(5, 142, 28, 0.843);
      text-align: center;
      padding-top: 50px;
      font-family: Arial, sans-serif;
    }
    h1 {
      color: white;
    }
    label {
      color: black;
      font-weight: bold;
    }
    input[type="text"], input[type="password"] {
      margin: 5px;
      padding: 8px 12px;
      border: 2px solid white;
      border-radius: 5px;
    }
    #btn {
      margin: 10px;
      padding: 10px 20px;
      background-color: rgb(71, 192, 71);
      border: 2px solid rgb(71, 192, 71);
      border-radius: 5px;
      color: whitesmoke;
      cursor: pointer;
    }
    #btn:hover {
      background-color: rgb(123, 246, 123);
      color: white;
    }
    .form-box {
      background-color: rgba(255, 255, 255, 0.1);
      display: inline-block;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>
  <div class="form-box">
    <h1>Register</h1>
    <form action="register.php" method="post">
      <label for="username">Username:</label><br>
      <input type="text" name="username" id="username" required><br><br>

      <label for="password">Password:</label><br>
      <input type="password" name="password" id="password" required><br><br>

      <label for="confirm_password">Re-enter Password:</label><br>
      <input type="password" name="confirm_password" id="confirm_password" required><br><br>

      <button id="btn" type="submit">Register</button>
    </form>

    <p>Already have an account? <a href="index.html" style="color: white;">Login here</a></p>

  </div>
</body>
</html>
