    <script>
        class Person {
    constructor(name, age) {
        this._name = name;
        this._age = age;
    }


    get name() {
        return this._name;
    }

    
    set name(newName) {
        if (newName.length > 0) {
            this._name = newName;
        } else {
            console.log("Name cannot be empty.");
        }
    }

    
    get age() {
        return this._age;
    }


    set age(newAge) {
        if (newAge > 0) {
            this._age = newAge;
        } else {
            console.log("Age must be positive.");
        }
    }
}


let person = new Person("Sathya", 24);

console.log(person.name); // Sathya
person.name = "Arun"; // Setting new name
console.log(person.name); // Arun

console.log(person.age); // 24
person.age = -5; // Invalid input, will show error message

    </script>
