<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
            border: 1px solid black;
            background-color: antiquewhite;
        }
        header{
            display: flex;
            width: 100%;
            text-align: center;
            background-color:red;
            color: white;
            padding: 20px;
        }

        nav{
            display: flex;
            width: 100%;
            text-align: center;
            background-color: aqua;
            color: white;
            padding: 20px;
        }
        section{
            display:flex;
            width: 50%;
            padding: 20px;
            text-align: center;
            background-color: yellow;
            color: white;
        }
        article{
            display:flex;
            width: 50%;
            padding: 20px;
            text-align: center;
            background-color: orange;
            color: white;
        }
        aside{
            position: absolute;
            width: 50%;
            top: 21%;
            left: 50%;
            padding: 50px;
            text-align: center;
            background-color: rosybrown;
            color: white;
         }
         footer{
            display: flex;
            width: 100%;
            text-align: center;
            background-color: gray;
            color: white;
            padding: 20px;
         }
    </style>
</head>
<body>
    <header>header</header>
    
        <nav>nav</nav>
        <section>section
            
        </section>
        <article>article
           
        </article> 
        <aside>aside</aside>   
    
    <footer>footer</footer>
</body>
</html>
