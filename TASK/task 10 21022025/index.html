<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     input[type=text], select, input[type=checkbox]{
        width: 100%;
        padding: 12px 20px;
        margin: 8px 0;
        display: inline-block;
        border: 1px solid black;
        border-radius: 4px;
        box-sizing: border-box;
     }
     input[type=submit]{
        width: 100%;
        background-color: purple;
        color: white;
        padding: 15px;
        margin: 8px 0;
        border: none;
        border-radius: 4px;
        cursor: pointer;
     }
     input[type=submit]:hover{
        background-color: rgb(182, 17, 182);
     }
     .dif{
        border-radius: 5px;
        background-color: rgb(26, 24, 24);
        color: whitesmoke;
        padding: 30px;
     }
       
    </style>
</head>

<body>
    <div class="dif">
    <form action="/action_page.php">
        <label for="fname"><h3>First Name:</h3></label>
        <input type="text" name="fname" id="name" placeholder="yours first name.."><br>

        <label for="lname"><h3>Last Name:</h3></label>
        <input type="text" name="lname" id="name" placeholder="yours last name..."><br>

        <label for="course"><h3>Course:</h3></label><br>
        <label for="course1">Java FullStack</label>
        <input type="checkbox" name="course1" id="java"><br>
        <label for="course2">Data Analysist</label>
        <input type="checkbox" name="course2" id="data"><br>
        <label for="course3">Dot Net</label>
        <input type="checkbox" name="course3" id="dot"><br>
        <label for="course4">Python FullStack</label>
        <input type="checkbox" name="course4" id="python"><br>

        <label for="count"><h3>Choose your country:</h3></label>
        <select id="count">
            <option value="count">India</option>
            <option value="count">UK</option>
            <option value="count">France</option>
        </select><br>
        <input type="submit" value="submit">
     

    </form>
</div> 
</body>
</html>
